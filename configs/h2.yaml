molecule:
  name: H2
  geometry: "H 0 0 0; H 0 0 0.735"   # Angstrom
  basis: sto-3g
  charge: 0
  spin: 0
  active_space:
    n_electrons: 2
    n_orbitals: 2

ansatze:
  EfficientSU2:
    reps: 1
    entanglement: linear
  UCCSD: {}
  fUCCSD: {}
  pp-tUPS:
    n_layers: 1

vqe:
  optimizer: SLSQP
  maxiter: 500
  seed: 42

backend:
  name: FakeTorino
  mode: precision      # "precision" or "shots"
  precision: 0.01      # used if mode: precision
  shots: 10000         # used if mode: shots
  method: density_matrix

mitigation:
  zne:
    noise_factors: [1, 3, 5, 7, 9]
    folding: global
    poly_order: 2
    method:
      EfficientSU2: linear
      UCCSD: poly
      fUCCSD: poly

  cdr:
    k: 2                    # non-Clifford gates kept per training circuit
    clifford_tol: 1.0e-6    # tolerance for detecting Clifford angles
    max_circuits: 1000      # cap on C(n, k); sample if exceeded
    sampling: random        # "all" or "random"
    seed: 42
    fit: linear             # E_exact = a1 * E_noisy + a2

  m0:
    shots: 36000
    postselection: false

output:
  data_dir: data/
  plots_dir: plots/
  timestamp: true           # adds date to output filenames