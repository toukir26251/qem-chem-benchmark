molecule:
  name: HF
  geometry: "H 0 0 0; F 0 0 1"  # Angstrom
  basis: sto-3g
  charge: 0
  spin: 0
  active_space:
    n_electrons: 10
    n_orbitals: 6

ansatze:
  EfficientSU2:
    reps: 1
    entanglement: linear
  UCCSD: {}
  fUCCSD: {}
  tUPS:
    n_layers: 1
    do_pp: True

vqe:
  optimizer: SLSQP
  maxiter: 500
  seeds: [37, 42]

backend:
  name: FakeTorino
  optimization_level: 3   # transpiler level, shared by ZNE, CDR and M0
  mode: precision      # "precision" or "shots"
  precision: 0.01     # used if mode: precision
  shots: 10000         # used if mode: shots
  method: density_matrix

mitigation:
  zne:
    noise_factors: [1, 3, 5]
    folding: global
    poly_order: 2
    method:
      EfficientSU2: linear
      UCCSD: poly
      fUCCSD: exp

  cdr:
    k: 1
    clifford_tol: 1.0e-6
    max_circuits: 5000
    sampling: random
    fit: linear

  m0:
    shots: 10000
    postselection: false

output:
  data_dir: data/
  plots_dir: plots/
  timestamp: true